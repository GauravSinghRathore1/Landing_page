<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Page not found</title>
<meta name="description" content="The page you were looking for doesn't exist.">
<style>
  :root {
    --bg: #0b0d12;
    --fg: #e8eaf0;
    --muted: #8b91a3;
    --accent: #6ea8ff;
    --accent-2: #b48cff;
    --card: #12151c;
    --border: #232837;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb;
      --fg: #12151c;
      --muted: #5d6477;
      --accent: #2f6df6;
      --accent-2: #7c4dff;
      --card: #ffffff;
      --border: #dfe3ee;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
  }
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(600px 400px at 20% 15%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
      radial-gradient(500px 400px at 85% 85%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 70%);
  }
  main {
    position: relative;
    width: 100%; max-width: 560px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 32px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .code {
    font-size: clamp(72px, 18vw, 120px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin: 0 0 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .code { animation: none; } }
  h1 { font-size: 22px; margin: 0 0 12px; font-weight: 650; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; font-size: 15px; }
  .path {
    display: inline-block; max-width: 100%;
    margin: 12px 0 24px; padding: 6px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; color: var(--fg);
    background: color-mix(in srgb, var(--fg) 6%, transparent);
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn, button.btn {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 11px 20px; border-radius: 10px; cursor: pointer;
    text-decoration: none; transition: transform .15s ease, opacity .15s ease;
  }
  a.btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: 0;
  }
  button.btn.ghost {
    background: transparent; color: var(--fg); border: 1px solid var(--border);
  }
  .btn:hover { transform: translateY(-1px); opacity: .92; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>This page doesn't exist</h1>
  <p>The link may be broken, or the page may have been moved or removed.</p>
  <div class="path" id="path" title=""></div>
  <p><strong style="color:var(--fg)">This domain has been purchased.</strong></p>
  <footer id="host"></footer>
</main>
<script>
  (function () {
    var p = location.pathname + location.search;
    var el = document.getElementById('path');
    el.textContent = p; el.title = p;
    document.getElementById('host').textContent = location.hostname;
    document.title = '404 – Page not found | ' + location.hostname;
  })();
</script>
</body>
</html>
