<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Delivery League — The Tye Playground</title>
<link rel="stylesheet" href="../../playground.css"><link rel="stylesheet" href="drive.css">
<script src="drive.js" defer></script>
</head>
<body>
<header class="tye-header"><a class="tye-brand" href="../../">The Tye Playground</a><nav aria-label="Main"><a href="../../404.html#games">Back to Arcade</a></nav></header>
<main>
<h1>Midnight Delivery League</h1>
<p id="controls">Drag left or right anywhere on the road to steer. Swipe down and hold to brake. On a keyboard, use the arrow keys.</p>
<div class="race">
<canvas id="road" tabindex="0" aria-label="Interactive race. Use left and right arrows to steer and down to brake." aria-describedby="controls"></canvas>
<div class="hud" aria-label="Race stats"><span id="speed">0 km/h</span><span id="cake">Cake 100%</span><span id="remaining">1.60 km</span></div>
<div class="overlay" id="overlay"><strong id="headline">Wedding cake on board</strong><span id="instruction">Touch the road to drive, or press Space.</span></div>
</div>
<p id="result" role="status"></p>
</main></body></html>
